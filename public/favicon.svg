<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with rounded square for high visibility -->
  <rect width="512" height="512" rx="112" fill="#020617"/>
  
  <!-- Outer glowing ring / subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- The Iconic Emerald Green O -->
  <!-- Outer O curve -->
  <path d="M 256 46 C 132 46 48 138 48 256 C 48 374 132 466 256 466 C 380 466 464 374 464 256 C 464 138 380 46 foot
           M 256 46 C 374 46 456 140 456 256 C 456 372 374 466 256 466 C 138 466 56 372 56 256 C 56 140 138 46 256 46 Z"
        fill="#00c853"/>
  
  <!-- Solid Green O Badge -->
  <ellipse cx="256" cy="256" rx="196" ry="214" fill="#00C853"/>
  
  <!-- Inner White Cutout Oval -->
  <ellipse cx="256" cy="256" rx="110" ry="142" fill="#FFFFFF"/>
  
  <!-- Bold Black "2" -->
  <text x="256" y="278" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="160" 
        font-weight="900" 
        fill="#000000" 
        text-anchor="middle" 
        letter-spacing="-4">2</text>
        
  <!-- Golden-Yellow "TAXI" -->
  <text x="256" y="342" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="44" 
        font-weight="900" 
        fill="#F59E0B" 
        text-anchor="middle" 
        letter-spacing="5">TAXI</text>
</svg>
